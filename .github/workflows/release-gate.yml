name: Veyra Release Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Gitleaks
        run: |
          mkdir -p .local-tools/bin
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C .local-tools/bin gitleaks

      - name: Install Dependencies
        run: npm ci

      - name: Run Public Beta Release Gate
        run: npm run release:gate
        env:
          NODE_ENV: test
          NEXT_PUBLIC_APP_URL: https://agent-commerce-six.vercel.app
          SELLER_ADDRESS: "0x0000000000000000000000000000000000000001"
          BUYER_ADDRESS: "0x0000000000000000000000000000000000000002"
          HOSTED_AGENT_ADDRESS: "0x0000000000000000000000000000000000000003"
          NEXT_PUBLIC_ARC_CHAIN_ID: "5042002"
