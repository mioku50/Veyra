name: Veyra Release Gate

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"
  pull_request:
    branches: [main]

concurrency:
  group: release-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Release Verification Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: nightly

      - name: Install Gitleaks
        run: |
          mkdir -p .local-tools/bin
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.2/gitleaks_8.18.2_linux_x64.tar.gz | tar -xz -C .local-tools/bin gitleaks

      - name: Install Dependencies
        run: npm ci

      - name: Install Chromium for Browser Tests
        run: npx --no-install playwright install --with-deps chromium

      - name: Test Arc Index and Adoption Migrations
        run: |
          set -euo pipefail
          db=$(docker run -d --rm --network none -e POSTGRES_HOST_AUTH_METHOD=trust postgres:16-alpine)
          trap 'docker stop "$db" >/dev/null' EXIT
          # The image uses a socket-only server during initdb. Wait for the final TCP listener.
          timeout 30s bash -c 'until docker exec "$1" pg_isready -h 127.0.0.1 -U postgres; do sleep 1; done' _ "$db"
          docker exec "$db" psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role BYPASSRLS;'
          cat supabase/migrations/20261120090200_veyra_adoption_metrics.sql supabase/migrations/20261124120000_veyra_adoption_web_channel.sql scripts/veyra-adoption-metrics-tests.sql \
            | docker exec -i "$db" psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1
          cat supabase/migrations/20261120110000_arc_offer_index.sql scripts/arc-offer-index-tests.sql \
            supabase/migrations/20261124150000_arc_state_snapshots.sql scripts/arc-state-snapshots-tests.sql \
            | docker exec -i "$db" psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1

      - name: Run Public Beta Release Gate
        run: npm run release:gate
        env:
          NODE_ENV: test
          NEXT_PUBLIC_APP_URL: https://agent-commerce-six.vercel.app
          SELLER_ADDRESS: "0x0000000000000000000000000000000000000001"
          BUYER_ADDRESS: "0x0000000000000000000000000000000000000002"
          HOSTED_AGENT_ADDRESS: "0x0000000000000000000000000000000000000003"
          NEXT_PUBLIC_ARC_CHAIN_ID: "5042002"
